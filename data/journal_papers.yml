  - id: MS2024
    authors:
      - Danks, N.P.
      - Ray, S.
      - Shmueli, G.
    year: 2024
    title: "The Composite Overfit Analysis Framework: Assessing the Out-of-sample Generalizability of Construct-based Models Using Predictive Deviance, Deviance Trees, and Unstable Paths"
    journal: Management Science
    volume: 70
    issue: 1
    pages: 647-669
    doi: 10.1287/mnsc.2023.4705
    abstract: >
      Construct-based models (e.g., PLS path modeling and CBSEM) have become a mainstay of management research.
      However, these models are likely overfit to the data samples upon which they are estimated.
      We propose a composite overfit analysis (COA) framework that applies predictive tools to describe the sources and ramifications of overfit in terms of the focal concepts important to empirical researchers.
      The framework employs a novel deviance tree method to group deviant cases that have similar predictive deviance and for similar theoretical reasons.
  - id: IM2023
    authors:
      - Cano Bejar, A.H.
      - Ray, S.
      - Huang, Y.H.
    year: 2023
    title: "Fighting for the Status Quo: Threat to Tech Self-Esteem and Opposition to Competing Smartphones"
    journal: Information & Management
    volume: 60
    issue: 2
    article: "103748"
    doi: 10.1016/j.im.2022.103748
    abstract: >
      Users of rival technology platforms, such as Android-versus-iOS, often harbor hostile opposition to each other. We conducted an empirical study of
      smartphone users, where we find that the threat to technology self-esteem arises from distinct antecedents and
      offers a singular explanation for opposition. Moreover, we show the unintended consequences of employing lock-
      in strategies and provide advice on why and how to mitigate them.
