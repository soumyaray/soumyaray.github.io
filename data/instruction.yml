highlights:
  - "SOA"
  - "CSDS"
courses:
  # - id:                # course abbreviation; images/courses/<id>/ holds overview_* and figure_* images
  #   name:              # full name with abbreviation, e.g. "Service Oriented Architecture (SOA)"
  #   syllabus:          # downloads/syllabi/<id>.pdf — copy of the latest syllabus PDF
  #   syllabus_term:     # term of that syllabus, e.g. "Fall 2025"
  #   facebook_group:    # optional: url + name
  #   description:
  #   short_description: # home page
  - id: "SOA"
    name: "Service Oriented Architecture (SOA)"
    syllabus: "downloads/syllabi/SOA.pdf"
    syllabus_term: "Fall 2025"
    facebook_group:
      url: "https://www.facebook.com/groups/ISS.SOAD/"
      name: "Web Service Development @ NTHU"
    description: >
      This class develops skills to create reactive application architectures composed of distributed services.
      We utilize responsive interfaces, microservices, asynchronous background workers, message queues, and web sockets.
      We train to develop high quality code, publish open source, and deploy on cloud platforms.
    short_description: Creating scalable, domain-driven, distributed applications for business.
  - id: "SEC"
    name: "IT Service Security (SEC)"
    syllabus: "downloads/syllabi/SEC.pdf"
    syllabus_term: "Spring 2026"
    description: >
      This class transforms students understanding of information and their ability to develop secure software.
      We ensure authentication, authorization, confidentiality, integrity, and non-repudiation.
      Students implement encrypted storage and credentials, single sign-on, digital signing, token-based authorization, input validation, content-delivery networks, and content security policies.
    short_description: Using security principles to create highly secure and innovative services
  - id: "CSDS"
    name: "Computational Statistics for Data Science (CSDS)"
    syllabus: "downloads/syllabi/CSDS.pdf"
    syllabus_term: "Spring 2026"
    facebook_group:
      url: "https://www.facebook.com/groups/nthu.analytics/"
      name: "Business Analytics @ NTHU"
    description: >
      This class uses computational methods to overcome the limits of traditional statistics, to support decisions and produce reproducible analyses.
      We reshape data, run simulations, discover dimensions in data, use machine learning, and build complex models.
      Students write readable, reusable, and fast R code, implement their own algorithms, and create custom visualizations.
      Formerly "Business Analytics Using Computational Statistics (BACS)".
    short_description: Using computation as a lens to approach and understand statistics and data analysis.
